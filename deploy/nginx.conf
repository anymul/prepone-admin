# Example nginx server block for serving the built dashboard (dist/) on its own origin.
# Replace admin.example.com / api.example.com, add your TLS certificate, then:  nginx -t && nginx -s reload
#
# The headers below are what actually protect the admin session in the browser (XSS containment,
# clickjacking, MIME sniffing). They cannot be set from the SPA itself.
# The same header values can be used on Cloudflare Pages (_headers), Netlify, or any CDN.

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    # ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    root /var/www/prepone-admin/dist;
    index index.html;

    # --- Security headers -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # connect-src must list the API origin (the value of VITE_API_URL). 'unsafe-inline' for styles is
    # required by MUI/emotion; scripts stay locked to same-origin (no inline, no eval).
    # img-src https: lets question images / R2 assets render; tighten it to your CDN host if you can.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.solviq.in; frame-src 'self' https://api.solviq.in; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Caching ----------------------------------------------------------------------------------
    # Hashed build assets never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header does not inherit once a location sets its own, so repeat the security headers:
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so users pick up new deploys.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.solviq.in; frame-src 'self' https://api.solviq.in; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
